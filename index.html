<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
  <title>Untuk Kamu</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<!--
  Name: Mohamad Farhan
  Template: Untuk Kamu (supportive message edition)
-->
<body>
  <div id="particles-js"></div>

  <audio id="bgMusic" src="song.mp3" loop preload="auto"></audio>

  <div class="top-bar">
    <button id="themeToggle" type="button" aria-label="Ganti warna">🎨</button>
    <div class="clock-wrap">
      <div id="clockTime">00:00:00</div>
      <div id="clockGreet">Hai</div>
    </div>
    <button id="musicToggle" type="button" aria-label="Putar musik">♪</button>
  </div>

  <!-- Panel ganti warna -->
  <div class="theme-panel" id="themePanel" aria-hidden="true">
    <p class="theme-panel-title">Pilih warna</p>
    <div class="theme-swatches">
      <button class="swatch" data-theme="sunset" style="background:linear-gradient(135deg,#ff6a88,#a18cd1)"></button>
      <button class="swatch" data-theme="ocean" style="background:linear-gradient(135deg,#4facfe,#00f2fe)"></button>
      <button class="swatch" data-theme="peach" style="background:linear-gradient(135deg,#ffb199,#ff0844)"></button>
      <button class="swatch" data-theme="lavender" style="background:linear-gradient(135deg,#a18cd1,#fbc2eb)"></button>
      <button class="swatch" data-theme="mint" style="background:linear-gradient(135deg,#43e97b,#38f9d7)"></button>
      <button class="swatch" data-theme="night" style="background:linear-gradient(135deg,#232946,#6b6f9e)"></button>
    </div>
    <label class="theme-custom-label" for="customColor">Warna sendiri</label>
    <input type="color" id="customColor" value="#ff6a88" />
  </div>

  <section>
    <div class="card">
      <p class="eyebrow">Untuk Shalmaria, dari aku</p>
      <h1 id="timeTitle">Hai, Sayangkuu</h1>
      <p id="timeMessage">Semoga harimu baik-baik aja ya.</p>

      <p class="quote" id="quoteText"></p>

      <div class="btn-row">
        <a href="https://wa.me/6282258934843?text=Makasih%20ya%20udah%20bikin%20ini" class="btn btn-big">Peluk aku dong 🤍</a>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
